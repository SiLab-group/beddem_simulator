# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

name: BedDeM CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Needed so the test-results step can post a check + comment on the PR.
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Prepare
      run: |
        curl -s https://drive.switch.ch/index.php/s/JmxKrMLdqGeriGV/download --output plugins.zip
        unzip -q plugins.zip
    - name: Build with Ant
      run: ant build "-DECLIPSE_HOME=$(pwd)"
    - name: Run tests
      run: |
        ant run-test "-DECLIPSE_HOME=$(pwd)"
        ant junitreport
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()          # publish even when a test fails
      with:
        files: |
          junit/**/*.xml
        check_name: "Test Results"
        comment_mode: always        # always post/update a comment on the PR
        comment_title: "BedDeM test results"
    - name: Upload JUnit report
      uses: actions/upload-artifact@v4
      if: always()          # keep the HTML/XML report even on failure
      with:
        name: junit-report
        path: junit/

  visualize:
    # Fast, standalone job: renders the TIB decision charts from data/*.csv.
    # No Repast needed, so it does not depend on the build job.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Render TIB decision charts
      run: |
        pip install matplotlib
        for a in 1 2 3 4; do python analysis/plot_tib.py $a 0; done
    - name: Upload TIB charts
      uses: actions/upload-artifact@v4
      with:
        name: tib-charts
        path: analysis/tib_decision_agent*.png

